<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="Mascot.png">
    <title>Hero Bites - Super Food Stall</title>
</head>
<body>

    <img class="logo" src="Mascot.png" alt="logo">
    <header>
        <h1>Hero Bites</h1>
        <p>Power Up Your Hunger!</p>
    </header>

    <nav>
        <div class="categories" id="category-container">
            <button class="active" onclick="setCategory('All')">All</button>
            <button onclick="setCategory('Rice Meals')">Rice Meals</button>
            <button onclick="setCategory('Snacks')">Snacks</button>
            <button onclick="setCategory('Drinks')">Drinks</button>
        </div>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search 4 Food" oninput="renderProducts()">
            <select id="sort-select" onchange="sortProducts()">
                <option value="default">Sort By: Default</option>
                <option value="a-z">Name: A to Z</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>
        </div>
    </nav>

    <div class="container">
        <!-- Products Left -->
        <div class="products-section" id="products-grid">
            <!-- Products will be injected here by JS -->
        </div>

        <!-- Cart Right -->
        <div class="cart-section">
            <h2>playboi CARTi (CART)</h2>
            <div class="cart-items" id="cart-items-container">
                <!-- Cart items will appear here -->
            </div>
            <div class="cart-total">
                Total: ₱ <span id="cart-total-price">0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout & Download Receipt</button>
        </div>
    </div>

    <!-- Video Pop-up Ad Widget -->
    <div class="video-ad-container" id="hero-ad-popup">
        <div class="video-ad-header">
          <span>⚡ PROMOTIONAL VIDEO</span>
         <button class="video-ad-close" onclick="closeAd()" title="Dismiss Ad">×</button>
        </div>
        <video id="ad-video" autoplay muted loop playsinline>
            <source src="ads.mp4" type="video/mp4">
        Your browser does not support the video tag.
        </video>
</div>

    <script src="script.js"></script>
</body>
</html>
